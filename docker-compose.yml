# VietCite Studio local stack:  docker compose up -d   (or: make up)
#   WordPress  http://localhost:8080   (local only, WP_ENVIRONMENT_TYPE=local)
#   API        http://localhost:8000   (FastAPI)
#   Web        http://localhost:5173   (Vite dev server, proxies /api to the api service)
# Secrets come from .env (never committed). Compose refuses to start if a required one is empty.

name: vietcite

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:?set WP_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?set WP_DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?set WP_DB_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress_data:/var/www/html

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      GEO_DATA_DIR: /app/.data
      WP_BASE_URL: http://wordpress
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  mariadb_data:
  wordpress_data:
  api_data:
