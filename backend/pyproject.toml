[project]
name = "vietcite-backend"
version = "0.1.0"
description = "VietCite Studio backend: GEO multi-agent system (SE373, UIT)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Agent stack: same versions as the course labs (Buổi 3)
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langgraph==1.2.13",
    "langchain-openai==1.6.7",
    "pydantic>=2.13,<3",
    # Providers
    "httpx>=0.28,<1",
    "google-genai>=1.0,<2",
    # Web API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sse-starlette>=2.1,<4",
    "pyjwt>=2.9,<3",
    # Utilities
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.17.2",
    "pyright>=1.1.390",
]

[project.scripts]
geo = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo", "app"]
only-include = ["geo", "app", "cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not live'"
markers = [
    "live: calls real external APIs (DeepSeek, Jina, Gemini); run with: pytest -m live",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["geo", "app", "cli.py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
