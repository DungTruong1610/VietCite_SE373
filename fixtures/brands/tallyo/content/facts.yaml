# Nguồn sự thật duy nhất cho website demo Tallyo.
#
# - Tallyo là THƯƠNG HIỆU GIẢ LẬP phục vụ đồ án SE373 (UIT). Mọi dữ kiện về công ty,
#   gói giá, số khách hàng... đều là dữ kiện giả lập do nhóm đặt ra.
# - Mọi con số hiển thị trên site phải lấy từ file này qua template, không gõ tay trong Markdown.
# - Mục `legal` mô tả văn bản pháp luật THẬT, đã đối chiếu nguồn chính thống ngày 24/10/2026
#   (xem docs/website-tallyo/phap-ly.md). Văn bản mới thì thêm với `verified: false` cho tới khi
#   đối chiếu xong; `sitegen check --strict` báo lỗi nếu trang nhắc văn bản chưa xác minh.
# - Trường `source_page` cho biết trang nào là nguồn chính thức của dữ kiện (dùng làm đáp án D1).
#
# Trạng thái: dữ kiện giả lập do Claude đề xuất, chờ nhóm duyệt; phần pháp luật đã xác minh 24/10/2026.

schema_version: 1

brand:
  id: tallyo
  name: Tallyo
  is_fictional: true
  aliases: [Tallyo, Tallyo POS, phần mềm Tallyo, ứng dụng Tallyo]
  legal_name: Công ty TNHH Phần mềm Tallyo
  category: Phần mềm quản lý bán hàng và hoá đơn điện tử
  tagline: Bán nhanh tại quầy, xuất hoá đơn đúng quy định, sổ sách gọn gàng.
  founded_year: 2023
  city: TP. Hồ Chí Minh
  team_size: 40
  customers:
    count: 3200
    as_of: 2026-10-01
    wording: hơn 3.200 hộ kinh doanh và cửa hàng nhỏ
    source_page: /gioi-thieu/
  mission: Giúp hộ kinh doanh chuyển từ ghi sổ tay sang bán hàng và kê khai đúng quy định mà không cần biết kế toán.
  audience:
    - Hộ kinh doanh đang chuyển từ thuế khoán sang kê khai
    - Tiệm tạp hoá, cửa hàng tiện lợi nhỏ
    - Quán cà phê, quán ăn
    - Shop thời trang, mỹ phẩm bán cả tại cửa hàng và online
  usp:
    - Lập hoá đơn điện tử khởi tạo từ máy tính tiền ngay khi tính tiền, không phải nhập lại
    - Sổ sách cho hộ kinh doanh tự lập từ dữ liệu bán hàng
    - Cài đặt trong một buổi, dùng được trên điện thoại Android, iPhone và trình duyệt
    - Hỗ trợ tiếng Việt cả tuần, kể cả Chủ nhật
  contact:
    support_email: hotro@tallyo.example
    sales_email: banhang@tallyo.example
    support_hours: 8:00–21:00, thứ Hai đến Chủ nhật
    phone: null   # cố ý không công bố số điện thoại để tránh trùng số thật
  site:
    base_url_env: TALLYO_SITE_URL
    base_url_default: http://localhost:8081
    blog_url_env: WP_BASE_URL
    blog_url_default: http://localhost:8080

voice:
  formality: thân thiện, rõ ràng, không dùng thuật ngữ kế toán khi chưa giải thích
  self_reference: Tallyo
  address_reader: bạn
  sentence_style: câu ngắn, mỗi đoạn một ý, ưu tiên ví dụ cụ thể của tiệm tạp hoá và quán cà phê
  sample_sentences:
    - Bạn tính tiền xong là hoá đơn điện tử đã được lập, không phải ngồi nhập lại cuối ngày.
    - Tallyo không bán phần cứng. Máy in nhiệt bạn đang dùng thường vẫn dùng được.
  forbidden_phrases: [số 1, tốt nhất, rẻ nhất, cam kết 100%, đảm bảo không bị phạt]
  required_terms:
    - hoá đơn điện tử
    - hộ kinh doanh
  notes: Lần đầu nhắc tới "HĐĐT" phải viết đủ "hoá đơn điện tử".

trial:
  days: 15
  credit_card_required: false
